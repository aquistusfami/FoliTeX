name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "project(FoliTeX VERSION $version " CMakeLists.txt \
            || { echo "::error::CMakeLists.txt version does not match tag $GITHUB_REF_NAME"; exit 1; }
          awk -v heading="## $version " 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "FoliTeX ${GITHUB_REF_NAME#v}" --notes-file notes.md
